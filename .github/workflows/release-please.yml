name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # No language preset: this repo is documentation-first.
          # Switch to "node", "python", "go", etc. once the implementation
          # language is locked in.
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}
